name = "comandas-empanadas-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# --- Base de datos D1 -----------------------------------------------------
# 1. Crear la base de datos:
#      wrangler d1 create comandas-empanadas
# 2. Copiar el "database_id" que devuelve el comando y pegarlo abajo.
[[d1_databases]]
binding = "DB"
database_name = "comandas-empanadas"
database_id = "aeb1084d-0bd3-40a7-918d-7460ae09bc0f"

# --- Durable Object para el correlativo atómico ---------------------------
[[durable_objects.bindings]]
name = "CORRELATIVO"
class_name = "Correlativo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Correlativo"]

# --- Secret (no va en este archivo) ---------------------------------------
# El token compartido que usan las PWAs y el Bridge para autenticarse.
# Configúralo con:
#      wrangler secret put API_TOKEN
