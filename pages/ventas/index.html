<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#c1440e" />
<title>Comandas - Ventas</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="stylesheet" href="../shared/estilos.css" />
</head>
<body>

<div id="pantalla-config" class="config-pantalla" hidden>
  <h2>Configurar conexión</h2>
  <p style="color:var(--texto-suave)">Esto ya viene configurado por defecto. Solo cámbialo si te lo pidieron expresamente.</p>
  <label for="cfg-url">URL de la API (Worker)</label>
  <input id="cfg-url" type="url" placeholder="https://comandas-empanadas-api.tuusuario.workers.dev"
    autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
  <label for="cfg-token">Token de acceso</label>
  <input id="cfg-token" type="text" placeholder="token"
    autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
  <button class="boton" id="cfg-guardar" style="margin-top:18px">Guardar y continuar</button>
  <button class="boton secundario" id="cfg-cancelar" style="margin-top:10px">Cancelar</button>
  <p id="cfg-error" class="aviso error" hidden></p>
</div>

<div id="app" hidden>
  <header class="barra">
    <a href="../index.html" style="text-decoration:none;color:#fff;font-size:1.3rem;line-height:1" title="Volver al inicio">🏠</a>
    <h1 style="flex:1;text-align:center">🧾 Empanadas</h1>
    <span class="rol">Ventas</span>
    <button id="btn-reconfigurar" class="boton chico secundario" style="background:transparent;color:#fff;border-color:#fff">⚙️</button>
  </header>

  <main>
    <div class="tabs">
      <button data-tab="nuevo" class="activo">Nuevo</button>
      <button data-tab="hoy">Pedidos de hoy</button>
      <button data-tab="inventario">Inventario</button>
    </div>

    <section id="tab-nuevo">
      <div class="tarjeta">
        <label for="cliente" style="display:block;font-weight:600;margin-bottom:6px">Nombre del cliente <span style="font-weight:400;color:var(--texto-suave)">(opcional)</span></label>
        <input id="cliente" type="text" placeholder="Ej: Juanita" style="width:100%;padding:12px;font-size:1.1rem;border:1px solid var(--borde);border-radius:10px" />
      </div>
      <div class="tarjeta" id="lista-sabores"></div>
      <button class="boton" id="btn-imprimir">IMPRIMIR COMANDA</button>
      <p id="msg-nuevo" hidden></p>
    </section>

    <section id="tab-hoy" hidden>
      <div id="lista-pedidos"><p class="vacio">Cargando…</p></div>
    </section>

    <section id="tab-inventario" hidden>
      <div class="tarjeta" id="lista-inventario"></div>
    </section>
  </main>
</div>

<script type="module">
import { api, SABORES, tieneConfig, getConfig, setConfig, fechaHoyLocal, escapeHtml } from '../shared/api.js';

// --- Configuración inicial -------------------------------------------------
const pantallaConfig = document.getElementById('pantalla-config');
const appDiv = document.getElementById('app');
let yaIniciado = false;

function mostrarApp() {
  pantallaConfig.hidden = true;
  appDiv.hidden = false;
  iniciarApp();
}

if (!tieneConfig()) {
  pantallaConfig.hidden = false;
} else {
  mostrarApp();
}

document.getElementById('btn-reconfigurar').addEventListener('click', () => {
  const actual = getConfig();
  document.getElementById('cfg-url').value = actual.url;
  document.getElementById('cfg-token').value = actual.token;
  appDiv.hidden = true;
  pantallaConfig.hidden = false;
});

document.getElementById('cfg-guardar').addEventListener('click', async () => {
  const url = document.getElementById('cfg-url').value;
  const token = document.getElementById('cfg-token').value;
  const err = document.getElementById('cfg-error');
  if (!url) { err.hidden = false; err.textContent = 'Ingresa la URL de la API'; return; }
  setConfig(url, token);
  try {
    await api.health();
    err.hidden = true;
    mostrarApp();
  } catch (e) {
    err.hidden = false;
    err.textContent = 'No se pudo conectar: ' + e.message;
  }
});

document.getElementById('cfg-cancelar').addEventListener('click', () => {
  document.getElementById('cfg-error').hidden = true;
  if (yaIniciado) mostrarApp();
});

// --- App --------------------------------------------------------------
function iniciarApp() {
  if (yaIniciado) return;
  yaIniciado = true;

  const cantidades = Object.fromEntries(SABORES.map((s) => [s, 0]));
  renderSabores();
  cambiarTab('nuevo');
  document.querySelectorAll('.tabs button').forEach((b) =>
    b.addEventListener('click', () => cambiarTab(b.dataset.tab))
  );
  document.getElementById('btn-imprimir').addEventListener('click', imprimirComanda);

  cargarPedidos();
  cargarInventario();
  setInterval(cargarPedidos, 5000);

  function renderSabores() {
    const cont = document.getElementById('lista-sabores');
    cont.innerHTML = '';
    SABORES.forEach((sabor) => {
      const fila = document.createElement('div');
      fila.className = 'fila-sabor';
      fila.innerHTML = `
        <span class="nombre ${sabor === 'Pino' ? 'pino' : ''}">${sabor}</span>
        <span class="stepper">
          <button type="button" data-op="menos">−</button>
          <input type="number" inputmode="numeric" min="0" value="0" readonly />
          <button type="button" data-op="mas">+</button>
        </span>`;
      const input = fila.querySelector('input');
      fila.querySelector('[data-op="menos"]').addEventListener('click', () => {
        cantidades[sabor] = Math.max(0, cantidades[sabor] - 1);
        input.value = cantidades[sabor];
      });
      fila.querySelector('[data-op="mas"]').addEventListener('click', () => {
        cantidades[sabor] += 1;
        input.value = cantidades[sabor];
      });
      cont.appendChild(fila);
    });
  }

  async function imprimirComanda() {
    const items = SABORES.filter((s) => cantidades[s] > 0).map((s) => ({ sabor: s, cantidad: cantidades[s] }));
    const msg = document.getElementById('msg-nuevo');
    if (items.length === 0) {
      msg.hidden = false; msg.className = 'aviso error'; msg.textContent = 'Ingresa al menos una cantidad';
      return;
    }
    const clienteInput = document.getElementById('cliente');
    const cliente = clienteInput.value.trim();
    const btn = document.getElementById('btn-imprimir');
    btn.disabled = true; btn.textContent = 'Enviando...';
    try {
      const pedido = await api.crearPedido(items, cliente);
      msg.hidden = false; msg.className = 'aviso exito';
      msg.textContent = `Comanda #${pedido.correlativo} enviada a impresión`;
      SABORES.forEach((s) => (cantidades[s] = 0));
      renderSabores();
      clienteInput.value = '';
      cargarPedidos();
    } catch (e) {
      msg.hidden = false; msg.className = 'aviso error'; msg.textContent = 'Error: ' + e.message;
    } finally {
      btn.disabled = false; btn.textContent = 'IMPRIMIR COMANDA';
    }
  }

  async function cargarPedidos() {
    const cont = document.getElementById('lista-pedidos');
    try {
      const { pedidos } = await api.listarPedidos(fechaHoyLocal());
      if (pedidos.length === 0) {
        cont.innerHTML = '<p class="vacio">Sin pedidos hoy todavía</p>';
        return;
      }
      cont.innerHTML = pedidos.map(renderPedido).join('');
    } catch (e) {
      cont.innerHTML = `<p class="aviso error">No se pudo cargar: ${e.message}</p>`;
    }
  }

  function renderPedido(p) {
    const items = p.items.map((it) => `<div class="linea-item"><span>${it.sabor}</span><span class="cant">${it.cantidad_pedida}</span></div>`).join('');
    return `<div class="tarjeta">
      <div class="pedido-cabecera">
        <span class="num">#${p.correlativo}</span>
        <span class="hora">${p.hora}</span>
      </div>
      ${p.cliente ? `<div style="color:var(--texto-suave);margin-bottom:6px">Cliente: ${escapeHtml(p.cliente)}</div>` : ''}
      <span class="badge ${p.estado}">${etiquetaEstado(p.estado)}</span>
      <div style="margin-top:10px">${items}</div>
    </div>`;
  }

  function etiquetaEstado(e) {
    return { pendiente: 'Pendiente', impreso: 'Impreso', error_impresion: 'Error impresión', listo: 'Listo' }[e] || e;
  }

  async function cargarInventario() {
    const cont = document.getElementById('lista-inventario');
    try {
      const { inventario } = await api.inventario();
      cont.innerHTML = inventario.map((it) => `
        <div class="fila-sabor">
          <span class="nombre">${it.sabor}</span>
          <span class="stepper">
            <button type="button" data-sabor="${it.sabor}" data-op="-1">−</button>
            <input type="number" value="${it.stock}" readonly />
            <button type="button" data-sabor="${it.sabor}" data-op="1">+</button>
          </span>
        </div>`).join('');
      cont.querySelectorAll('button[data-sabor]').forEach((b) =>
        b.addEventListener('click', async () => {
          await api.ajustarInventario(b.dataset.sabor, { delta: Number(b.dataset.op) });
          cargarInventario();
        })
      );
    } catch (e) {
      cont.innerHTML = `<p class="aviso error">${e.message}</p>`;
    }
  }

  function cambiarTab(tab) {
    ['nuevo', 'hoy', 'inventario'].forEach((t) => {
      document.getElementById('tab-' + t).hidden = t !== tab;
    });
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('activo', b.dataset.tab === tab));
    if (tab === 'hoy') cargarPedidos();
    if (tab === 'inventario') cargarInventario();
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
